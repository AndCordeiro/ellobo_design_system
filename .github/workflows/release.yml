name: Release

# Flow:
#   1. Every PR adds a changeset (`npm run changeset`).
#   2. On merge to `main` with pending changesets, this workflow opens/updates the Version PR
#      ("chore: release design system") with the new version and CHANGELOG.
#   3. Merging the Version PR runs the workflow again: no changesets are pending, so it validates
#      the package, creates the git tag `vX.Y.Z` and the GitHub Release with the CHANGELOG notes.
#
# Nothing is published to a package registry. See README "Publishing to GitHub Packages".
# Requires "Allow GitHub Actions to create and approve pull requests" in the repository settings.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR or GitHub Release
    runs-on: ubuntu-latest
    if: github.repository == 'AndCordeiro/ellobo_design_system'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate before any release step
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --ci
          npm run build

      - name: Create or update the Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          commit: 'chore: release design system'
          title: 'chore: release design system'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag and GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.mjs > release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md

      - name: Summary
        run: |
          echo "Pending changesets: ${{ steps.changesets.outputs.hasChangesets }}"
          echo "Version: ${{ steps.version.outputs.version || 'n/a' }} (tag exists: ${{ steps.version.outputs.exists || 'n/a' }})"
