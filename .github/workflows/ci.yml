name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test -- --ci

      - name: Build
        run: npm run build

      - name: Verify generated version is in sync
        run: |
          npm run sync-version
          git diff --exit-code -- src/version.ts

      - name: Pack (sanity check of published files)
        run: npm pack --dry-run

  example:
    name: Example app typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install library dependencies
        run: npm ci --ignore-scripts

      - name: Install example dependencies
        run: npm ci --prefix example

      - name: Typecheck example
        run: npm run example:typecheck
